{% extends "base.html" %}
{% block title %}Plan comptable{% endblock %}
{% block content %}
<div class="page-title"><h1>Plan comptable SYSCOHADA</h1>
  <div class="d-flex gap-2"><form class="d-flex gap-2">
    <select name="classe" class="form-select form-select-sm" onchange="this.form.submit()"><option value="">Toutes les classes</option>
    {% for n, lib in classes %}<option value="{{ n }}" {% if request.GET.classe == n|stringformat:"s" %}selected{% endif %}>Classe {{ n }} — {{ lib }}</option>{% endfor %}</select>
    <input name="q" value="{{ request.GET.q }}" class="form-control form-control-sm" placeholder="N° ou intitulé"></form>
  <a class="btn btn-primary btn-sm text-nowrap" href="{% url 'comptabilite:compte_create' %}"><i class="bi bi-plus"></i> Nouveau compte</a></div></div>
<div class="card"><table class="table table-sm table-hover mb-0">
<thead><tr><th>N°</th><th>Intitulé</th><th>Classe</th><th>Lettrable</th></tr></thead><tbody>
{% for c in object_list %}<tr class="{% if c.numero|length <= 2 %}fw-bold table-light{% endif %}"><td><a href="{% url 'comptabilite:compte_update' c.pk %}">{{ c.numero }}</a></td>
<td style="padding-left:{{ c.numero|length }}rem">{{ c.intitule }}</td><td>{{ c.classe }}</td><td>{% if c.lettrable %}<i class="bi bi-check"></i>{% endif %}</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
