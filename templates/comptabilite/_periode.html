<form class="card card-body d-print-none mb-3"><div class="row g-2 align-items-end">
  {% for field in form %}<div class="col-md-2"><label class="form-label small mb-0">{{ field.label }}</label>{{ field }}</div>{% endfor %}
  {% if tiers %}<input type="hidden" name="tiers" value="{{ tiers.pk }}">{% endif %}
  <div class="col-md-auto"><button class="btn btn-primary btn-sm"><i class="bi bi-funnel"></i> Afficher</button>
  <button type="button" class="btn btn-outline-secondary btn-sm" onclick="window.print()"><i class="bi bi-printer"></i></button>
  {% if export %}<button class="btn btn-outline-success btn-sm" name="export" value="csv"><i class="bi bi-filetype-csv"></i> Export</button>{% endif %}</div>
</div></form>
