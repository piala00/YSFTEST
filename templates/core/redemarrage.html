{% extends "base.html" %}
{% block title %}Redémarrage{% endblock %}
{% block content %}
<div class="container" style="max-width:560px"><div class="card card-body mt-4 text-center">
  <div class="spinner-border mx-auto mb-3" role="status"></div>
  <h1 class="h5">Redémarrage du logiciel…</h1>
  <p class="small text-muted mb-0">Une nouvelle fenêtre du programme s'ouvre sur le serveur. Cette page se recharge toute seule
    dès que le logiciel répond (en général moins d'une minute).</p>
</div></div>
<script>
(function () {
  var essais = 0;
  function attendre() {
    essais++;
    fetch("/connexion/", {cache: "no-store"}).then(function (r) {
      if (r.ok && essais > 2) { location.href = "/"; } else { setTimeout(attendre, 2000); }
    }).catch(function () { setTimeout(attendre, 2000); });
  }
  setTimeout(attendre, 3000);
})();
</script>
{% endblock %}
