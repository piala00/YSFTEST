<title>ERP OHADA — Simulateur bureau</title>
<style>
/* Reproduction du client bureau CustomTkinter (thème clair, Windows) */
:root {
  --module: #1565c0; --module-fonce: #11519a;
  --bureau: #2b5d8a; --fenetre: #ebebeb; --fond: #f4f6f9; --blanc: #ffffff;
  --texte: #1a1a1a; --gris: #6b6b6b; --gris-clair: #a3abb4; --trait: #c9ced4;
  --entete-tableau: #dcdad5; --selection: #4a6984; --menu-survol: #cce8ff; --menu-bord: #99d1ff;
  --police: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(circle at 30% 20%, #3f7bb0, var(--bureau) 60%, #1d4466); font-family: var(--police); font-size: 13px; color: var(--texte); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
.bureau { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; padding: 14px; }
.barre-taches { position: fixed; left: 0; right: 0; bottom: 0; height: 34px; background: rgba(20, 28, 40, .92); display: flex; align-items: center; gap: 6px; padding: 0 10px; color: #fff; z-index: 50; }
.barre-taches .tache { padding: 4px 10px; border-radius: 4px; background: rgba(255,255,255,.12); font-size: 12px; cursor: pointer; border: 0; color: #fff; }
.barre-taches .tache.active { background: rgba(255,255,255,.28); }
.barre-taches .info { margin-left: auto; font-size: 11.5px; opacity: .8; }
.barre-taches a { color: #9fd0ff; }

/* Fenêtre Windows */
.fenetre { background: var(--fenetre); border: 1px solid #6f8396; box-shadow: 0 18px 50px rgba(0,0,0,.45); display: flex; flex-direction: column; overflow: hidden; }
.fenetre.principale { width: min(1320px, 100%); height: min(800px, calc(100vh - 62px)); margin-bottom: 30px; }
.barre-titre { height: 31px; background: var(--blanc); display: flex; align-items: center; gap: 8px; padding-left: 10px; flex: none; user-select: none; }
.barre-titre .ico { width: 16px; height: 16px; border-radius: 3px; background: var(--module); }
.barre-titre .titre { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barre-titre .ctrl { width: 46px; height: 31px; border: 0; background: none; font-size: 13px; cursor: default; }
.barre-titre .ctrl:hover { background: #e5e5e5; }
.barre-titre .ctrl.fermer:hover { background: #e81123; color: #fff; }

/* Barre de menus native */
.menubar { background: var(--blanc); display: flex; flex: none; border-bottom: 1px solid #f0f0f0; padding-left: 2px; position: relative; overflow-x: auto; }
.menubar > button { border: 1px solid transparent; background: none; padding: 2px 8px; margin: 1px 0; cursor: default; white-space: nowrap; }
.menubar > button:hover, .menubar > button.ouvert { background: var(--menu-survol); border-color: var(--menu-bord); }
.deroulant { position: fixed; z-index: 200; background: #f2f2f2; border: 1px solid #ccc; box-shadow: 2px 3px 6px rgba(0,0,0,.25); padding: 2px; min-width: 220px; max-height: 80vh; overflow-y: auto; }
.deroulant .cmd { display: flex; align-items: center; width: 100%; border: 1px solid transparent; background: none; text-align: left; padding: 3px 26px 3px 26px; white-space: nowrap; cursor: default; position: relative; }
.deroulant .cmd:hover:not(.grise), .deroulant .cmd.ouvert { background: var(--menu-survol); border-color: var(--menu-bord); }
.deroulant .cmd.grise { color: #8d8d8d; }
.deroulant .cmd .fleche { position: absolute; right: 8px; font-size: 10px; }
.deroulant .sep { height: 1px; background: #d7d7d7; margin: 3px 2px 3px 26px; }

/* Contenu CustomTkinter */
.entete-module { height: 44px; background: var(--module); color: #fff; display: flex; align-items: center; padding: 0 16px; gap: 14px; flex: none; }
.entete-module .nom { font-size: 17px; font-weight: 700; }
.entete-module .statut, .entete-module .compte { color: #e0e0e0; }
.entete-module .compte { margin-left: auto; }
.corps { flex: 1; display: flex; min-height: 0; background: var(--fond); }
.navigation { width: 280px; background: var(--blanc); display: flex; flex-direction: column; flex: none; }
.navigation.masquee { display: none; }
.option-menu { margin: 10px 10px 6px; display: flex; border-radius: 6px; overflow: hidden; background: var(--module); color: #fff; position: relative; }
.option-menu select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: #fff; padding: 5px 34px 5px 10px; width: 100%; cursor: pointer; }
.option-menu select option { color: #000; }
.option-menu::after { content: "▾"; position: absolute; right: 0; top: 0; bottom: 0; width: 28px; display: grid; place-items: center; background: var(--module-fonce); pointer-events: none; }
.arbre { flex: 1; overflow: auto; margin: 0 0 8px 6px; border: 1px solid #b9b9b9; background: #fff; }
.arbre .ligne { display: flex; align-items: center; height: 28px; white-space: nowrap; cursor: default; padding-right: 8px; }
.arbre .ligne .exp { width: 16px; text-align: center; font-size: 9px; color: #333; }
.arbre .ligne.groupe { font-weight: 700; }
.arbre .ligne.grise { color: var(--gris-clair); }
.arbre .ligne.sel { background: #e3ebf6; color: var(--module); }
.contenu { flex: 1; min-width: 0; padding: 14px 16px; display: flex; flex-direction: column; }
.page-tete { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.page-tete h1 { font-size: 20px; margin: 0; font-weight: 700; flex: 1; min-width: 160px; }
.ctk-btn { background: var(--module); color: #fff; border: 0; border-radius: 6px; padding: 5px 12px; min-width: 110px; cursor: pointer; }
.ctk-btn:hover { background: var(--module-fonce); }
.ctk-btn.gris { background: #455a64; } .ctk-btn.gris:hover { background: #37474f; }
.ctk-btn.vert { background: #2e7d32; } .ctk-btn.vert:hover { background: #1b5e20; }
.ctk-btn.neutre { background: #8a8a8a; }
.ctk-entry { border: 2px solid #979da2; border-radius: 6px; background: #f9f9fa; padding: 3px 8px; min-width: 0; }
.ctk-entry:focus { outline: none; border-color: var(--module); }
.ctk-combo { border: 2px solid #979da2; border-radius: 6px; background: #f9f9fa; padding: 3px 6px; }

/* Tableau ttk (thème clam) */
.tableau { flex: 1; min-height: 0; overflow: auto; background: #fff; border: 1px solid #9b9b9b; }
.tableau table { border-collapse: collapse; width: 100%; font-size: 13px; }
.tableau th { position: sticky; top: 0; background: var(--entete-tableau); font-weight: 700; border: 1px solid #b6b3ab; padding: 4px 6px; white-space: nowrap; }
.tableau td { padding: 3px 6px; height: 26px; white-space: nowrap; }
.tableau td.e { text-align: right; font-variant-numeric: tabular-nums; }
.tableau tr.total td { font-weight: 700; background: #e8eef6; }
.tableau tr.alerte td { color: #c62828; }
.tableau tbody tr.sel td { background: var(--selection); color: #fff; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.kpi { background: #fff; border-radius: 10px; padding: 10px 14px; }
.kpi .lib { color: gray; font-size: 11px; text-transform: uppercase; }
.kpi .val { font-size: 20px; font-weight: 700; }
.deux { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
.deux > div { display: flex; flex-direction: column; min-height: 0; }
.deux .lib { font-weight: 700; margin-bottom: 4px; }
.page-web { background: #dbdbdb; border-radius: 10px; padding: 24px; text-align: center; margin-top: 20px; }
.page-web .url { color: gray; margin: 6px 0 12px; word-break: break-all; }

/* Fenêtres secondaires et boîtes de message */
.voile { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.12); padding: 14px; }
.fenetre.secondaire { width: min(860px, 100%); max-height: calc(100vh - 60px); }
.fenetre.secondaire .interieur { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; overflow: auto; min-height: 0; flex: 1; }
.fenetre.petite { width: min(400px, 100%); }
.message { display: flex; gap: 14px; padding: 18px 18px 10px; background: #fff; }
.message .icone { font-size: 30px; line-height: 1; }
.message-pied { background: #f0f0f0; padding: 10px 14px; display: flex; justify-content: flex-end; gap: 8px; }
.win-btn { min-width: 88px; padding: 4px 10px; background: #e1e1e1; border: 1px solid #adadad; cursor: default; }
.win-btn:hover { background: #e5f1fb; border-color: #0078d7; }
.ligne-saisie { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: #dbdbdb; border-radius: 6px; padding: 8px; }
.lanceur { width: min(860px, 100%); }
.lanceur .interieur { padding: 22px 20px 26px; text-align: center; }
.lanceur h2 { font-size: 26px; margin: 0 0 2px; }
.cartes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 18px; text-align: center; }
.carte { background: #dbdbdb; border: 2px solid var(--c); border-radius: 12px; padding: 20px 12px 18px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.carte strong { color: var(--c); font-size: 17px; }
.carte span { color: gray; min-height: 3em; }
.carte .ctk-btn { background: var(--c); margin-top: 10px; }
.connexion .interieur { padding: 20px 30px 24px; display: flex; flex-direction: column; gap: 9px; align-items: stretch; text-align: center; }
.connexion h2 { margin: 0; font-size: 22px; color: var(--module); }
@media (max-width: 760px) {
  .navigation { width: 190px; } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .deux, .cartes { grid-template-columns: 1fr; }
  body { overflow: auto; } .fenetre.principale { height: auto; min-height: calc(100vh - 62px); }
}
</style>
</head>

    const articles = API.articles.filter(a => a.actif);
    const lignes = [];
    const choixTiers = el("select", { class: "ctk-combo", style: "width:340px" }, tiers.map(t => el("option", { value: t.id, text: `${t.code} - ${t.nom}` })));
    const choixArticle = el("select", { class: "ctk-combo", style: "width:320px" }, el("option", { value: "", text: "" }), articles.map(a => el("option", { value: a.id, text: `${a.reference} - ${a.designation}` })));
    const qte = el("input", { class: "ctk-entry", style: "width:70px", placeholder: "Qté" });
    const prix = el("input", { class: "ctk-entry", style: "width:100px", placeholder: "P.U. HT" });
    const tva = el("input", { class: "ctk-entry", style: "width:60px", placeholder: "TVA %" });
    choixArticle.addEventListener("change", () => {
      const a = articles.find(x => String(x.id) === choixArticle.value); if (!a) return;
      qte.value = "1"; prix.value = vente ? a.prix_vente : a.prix_achat; tva.value = a.taux_tva;
    });
    const tableau = Tableau([["designation", "Désignation", 320, "w"], ["quantite", "Qté", 70, "e"], ["pu", "P.U. HT", 110, "e"], ["taux_tva", "TVA %", 70, "e"], ["ht", "Montant HT", 120, "e"]]);
    const total = el("div", { style: "font-weight:700;text-align:right" });
    const actualiser = () => {
      let ht = 0, t = 0;
      tableau.remplir(lignes.map(l => { const m = Math.round(l.quantite * l.prix_unitaire); ht += m; t += Math.round(m * l.taux_tva / 100); return { ...l, pu: montant(l.prix_unitaire), ht: montant(m), _source: l }; }));
      total.textContent = `Total HT : ${montant(ht)}    TVA : ${montant(t)}    TTC : ${montant(ht + t)}`;
    };
    const ajouter = () => {
      const a = articles.find(x => String(x.id) === choixArticle.value);
      const q = parseFloat(qte.value.replace(",", ".")), pu = parseFloat(prix.value.replace(",", ".").replace(/\s/g, "")), tx = parseFloat((tva.value || "19.25").replace(",", "."));
      if (!a) return messagebox("Saisie", "Choisissez un article.", "warning");
      if ([q, pu, tx].some(isNaN)) return messagebox("Saisie", "Quantité, prix et TVA doivent être numériques.", "warning");
      lignes.push({ designation: a.designation, quantite: q, prix_unitaire: pu, taux_tva: tx }); actualiser();
    };
    const enregistrer = valider => {
      if (!lignes.length) return messagebox("Saisie", "Choisissez un tiers et ajoutez au moins une ligne.", "warning");
      etat.simul += 1;
      messagebox("Facture", `Simulation : facture ${valider ? "validée" : "enregistrée en brouillon"} (${lignes.length} ligne${lignes.length > 1 ? "s" : ""}).\nDans le logiciel réel, elle est numérotée, déstocke et passe l'écriture au journal des ${vente ? "ventes" : "achats"}.`)
        .then(fermerFenetre);
    };
    ouvrirFenetre(fenetre(`Nouvelle facture ${vente ? "client" : "fournisseur"}`, "secondaire", el("div", { class: "interieur" },
      el("div", { style: "display:flex;gap:8px;align-items:center" }, vente ? "Client :" : "Fournisseur :", choixTiers),
      el("div", { class: "ligne-saisie" }, choixArticle, qte, prix, tva, el("button", { class: "ctk-btn", style: "min-width:80px", text: "Ajouter", onclick: ajouter })),
      el("div", { style: "height:260px;display:flex" }, tableau.racine), total,
      el("div", { style: "display:flex;gap:8px" },
        el("button", { class: "ctk-btn neutre", text: "Retirer la ligne", onclick: () => { const l = tableau.selection(); if (l) { lignes.splice(lignes.indexOf(l._source), 1); actualiser(); } } }),
        el("span", { style: "flex:1" }),
        el("button", { class: "ctk-btn", text: "Enregistrer en brouillon", onclick: () => enregistrer(false) }),
        el("button", { class: "ctk-btn vert", text: "Enregistrer et valider", onclick: () => enregistrer(true) })))));
    actualiser();
  }

  afficherLanceur();
})();
</script>
</body>
</html>
